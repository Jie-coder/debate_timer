<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辩论计时器</title>
  <style>
:root {
    /*EDITMODE-BEGIN*/
    --tweak-theme: "warm";    --tweak-font-scale: 1;
    --tweak-sound: true;
    --tweak-pro-name: "正方";
    --tweak-con-name: "反方";
    --tweak-立论: 180;
    --tweak-质询: 90;
    --tweak-对辩: 120;
    /*EDITMODE-END*/
  }

  /* Warm theme (default) */
  [data-theme="warm"] {
    --bg: oklch(0.975 0.008 80);
    --bg-2: oklch(0.955 0.012 80);
    --bg-3: oklch(0.92 0.015 80);
    --surface: oklch(0.99 0.005 80);
    --border: oklch(0.88 0.015 80);
    --border-strong: oklch(0.78 0.02 80);
    --ink: oklch(0.22 0.015 60);
    --ink-2: oklch(0.42 0.015 60);
    --ink-3: oklch(0.58 0.015 60);
    --accent: oklch(0.62 0.15 45);
    --accent-soft: oklch(0.92 0.05 55);
    --warn: oklch(0.68 0.18 35);
    --ok: oklch(0.6 0.12 150);
  }

  [data-theme="dark"] {
    --bg: oklch(0.18 0.008 80);
    --bg-2: oklch(0.22 0.01 80);
    --bg-3: oklch(0.26 0.012 80);
    --surface: oklch(0.24 0.01 80);
    --border: oklch(0.32 0.015 80);
    --border-strong: oklch(0.42 0.02 80);
    --ink: oklch(0.94 0.008 80);
    --ink-2: oklch(0.72 0.01 80);
    --ink-3: oklch(0.55 0.012 80);
    --accent: oklch(0.72 0.15 55);
    --accent-soft: oklch(0.32 0.08 55);
    --warn: oklch(0.72 0.18 35);
    --ok: oklch(0.72 0.14 150);
  }

  [data-theme="paper"] {
    --bg: oklch(0.965 0.015 85);
    --bg-2: oklch(0.945 0.02 85);
    --bg-3: oklch(0.9 0.025 85);
    --surface: oklch(0.985 0.01 85);
    --border: oklch(0.85 0.025 80);
    --border-strong: oklch(0.7 0.03 75);
    --ink: oklch(0.25 0.03 60);
    --ink-2: oklch(0.45 0.025 60);
    --ink-3: oklch(0.6 0.02 60);
    --accent: oklch(0.55 0.17 30);
    --accent-soft: oklch(0.9 0.06 40);
    --warn: oklch(0.6 0.2 30);
    --ok: oklch(0.55 0.12 140);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: "Noto Sans SC", "Newsreader", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: calc(16px * var(--font-scale, 1));
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  .app {
    height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    position: relative;
  }

  /* ========== Header ========== */
  header {
    padding: 20px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    font-family: "Newsreader", serif;
  }

  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--accent);
    position: relative;
  }

  .brand-mark::after {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--surface);
  }

  .brand-mark::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 10px;
    background: var(--accent);
    transform: translate(-50%, -50%);
    z-index: 1;
  }

  .brand-name {
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.02em;
  }
  .brand-topic {
    font-family: "Newsreader", "Noto Sans SC", serif;
    font-size: 22px;
    font-weight: 500;
    color: var(--ink);
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 4px 6px;
    min-width: 220px;
    max-width: 520px;
    outline: none;
    letter-spacing: -0.005em;
    transition: border-color .15s ease, background .15s ease;
  }
  .brand-topic::placeholder { color: var(--ink-3); font-style: italic; font-weight: 400; }
  .brand-topic:hover { border-bottom-color: var(--border-strong); }
  .brand-topic:focus { border-bottom-color: var(--accent); background: var(--bg-2); border-radius: 4px; }

  .brand-sub {
    font-size: 12px;
    color: var(--ink-3);
    font-family: "JetBrains Mono", monospace;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-actions {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .icon-btn:hover {
    background: var(--bg-2);
    color: var(--ink);
    border-color: var(--border);
  }

  .icon-btn.active {
    background: var(--accent-soft);
    color: var(--accent);
  }

  /* ========== Mode tabs ========== */
  .mode-tabs {
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    padding: 4px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }

  .mode-tab {
    border: none;
    background: transparent;
    padding: 8px 18px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-2);
    transition: all 0.2s ease;
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .mode-tab:hover {
    color: var(--ink);
  }

  .mode-tab.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 3px oklch(0 0 0 / 0.06);
  }

  /* ========== Main stage ========== */
  main {
    padding: 40px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* Single timer */
  .single-timer {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
    min-height: 0;
  }
  .timer-actions { margin-top: 4px; }

  .single-label {
    font-family: "Newsreader", serif;
    font-style: italic;
    font-size: 22px;
    color: var(--ink-3);
    letter-spacing: 0.03em;
  }

  .single-time {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(120px, 22vw, 280px);
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 0.9;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: color 0.3s ease;
    cursor: text;
  }
  .single-time.editing, .duel-time.editing {
    outline: 2px dashed var(--accent);
    outline-offset: 8px;
    border-radius: 6px;
  }
  .duel-time { cursor: text; }

  .timer-actions {
    display: flex;
    gap: 12px;
    margin-top: 8px;
  }
  .timer-action-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    padding: 8px 18px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .timer-action-btn:hover { background: var(--bg-2); color: var(--ink); }
  .duel-reset-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-2);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    opacity: 0.7;
  }
  .duel-reset-btn:hover { opacity: 1; background: var(--bg-2); }
  .duel-panel[data-side="con"] .duel-reset-btn {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.15);
    color: var(--bg);
  }

  .single-time.warning { color: var(--warn); }
  .single-time.overtime { color: var(--warn); animation: pulse 0.8s ease infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .progress-wrap {
    width: min(720px, 80%);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .progress-bar {
    height: 6px;
    background: var(--bg-3);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    background: var(--ink);
    border-radius: 999px;
    transition: width 0.2s linear, background 0.3s ease;
  }

  .progress-fill.warning { background: var(--warn); }

  /* Duel timer */
  .duel {
    flex: 1;
    display: grid;
    grid-template-rows: 1fr 1fr;
    gap: 16px;
    min-height: 0;
  }

  .duel-panel {
    position: relative;
    border-radius: 18px;
    border: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 36px 60px;
    cursor: pointer;
    transition: all 0.3s ease;
    overflow: hidden;
  }

  .duel-panel[data-side="con"] {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
  }

  .duel-panel.inactive { opacity: 0.55; }

  .duel-panel.active {
    box-shadow: 0 0 0 2px var(--accent), 0 12px 40px oklch(0 0 0 / 0.08);
    transform: scale(1.005);
  }

  .duel-panel.active[data-side="con"] {
    box-shadow: 0 0 0 2px var(--accent), 0 12px 40px oklch(0 0 0 / 0.3);
  }

  .duel-side {
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1;
  }

  .duel-side-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.55;
  }

  .duel-side-name {
    font-family: "Newsreader", serif;
    font-size: 44px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  .duel-status {
    font-size: 12px;
    font-family: "JetBrains Mono", monospace;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.55;
    margin-top: 2px;
  }

  .duel-panel.active .duel-status::before {
    content: "●  ";
    color: var(--accent);
    animation: blink 1.2s ease infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .duel-time {
    font-family: "JetBrains Mono", monospace;
    font-size: clamp(80px, 13vw, 160px);
    font-weight: 300;
    letter-spacing: -0.04em;
    line-height: 0.9;
    font-variant-numeric: tabular-nums;
    z-index: 1;
    transition: color 0.3s ease;
  }

  .duel-time.warning { color: var(--warn); }
  .duel-time.overtime { color: var(--warn); animation: pulse 0.8s ease infinite; }

  .duel-progress {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 3px;
    background: transparent;
  }

  .duel-progress-fill {
    height: 100%;
    background: var(--accent);
    width: 100%;
    transition: width 0.2s linear;
  }

  .duel-divider {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--bg);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-2);
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    z-index: 2;
  }

  /* Footer */
  footer {
    padding: 20px 40px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .btn {
    border: 1px solid var(--border-strong);
    background: var(--surface);
    color: var(--ink);
    padding: 10px 22px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    letter-spacing: 0.02em;
  }

  .btn:hover { background: var(--bg-2); }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border-color: var(--ink);
    min-width: 140px;
    justify-content: center;
    padding: 12px 24px;
  }

  .btn-primary:hover {
    background: var(--ink-2);
    border-color: var(--ink-2);
  }

  .btn-accent {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .btn-ghost {
    border-color: transparent;
  }

  .kbd {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--bg-2);
    color: var(--ink-3);
    border: 1px solid var(--border);
    letter-spacing: 0.05em;
  }

  .session-flow {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    color: var(--ink-3);
  }

  .flow-dots {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .flow-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border-strong);
    transition: all 0.2s ease;
  }

  .flow-dot.done { background: var(--accent); }
  .flow-dot.current {
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .flow-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .keyhint {
    font-size: 12px;
    color: var(--ink-3);
    display: flex;
    gap: 14px;
  }

  /* ========== Settings drawer ========== */
  .drawer {
    position: fixed;
    top: 0;
    right: -380px;
    width: 380px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 24px 28px;
    overflow-y: auto;
    transition: right 0.3s ease;
    z-index: 50;
  }

  .drawer.open { right: 0; }

  .drawer h3 {
    font-family: "Newsreader", serif;
    font-size: 20px;
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .drawer-section {
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }

  .drawer-section-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 12px;
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    gap: 12px;
  }

  .field-label {
    font-size: 13px;
    color: var(--ink-2);
  }

  .input {
    border: 1px solid var(--border-strong);
    background: var(--bg);
    color: var(--ink);
    padding: 8px 12px;
    border-radius: 8px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    width: 100px;
    text-align: center;
  }

  .input-text {
    font-family: "Noto Sans SC", sans-serif;
    text-align: left;
  }

  .chip-group {
    display: flex;
    gap: 4px;
    background: var(--bg-2);
    padding: 3px;
    border-radius: 8px;
  }

  .chip {
    border: none;
    background: transparent;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--ink-2);
    cursor: pointer;
    font-family: inherit;
  }

  .chip.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px oklch(0 0 0 / 0.05);
  }

  /* ===== Timer storage (presets) ===== */
  .preset-create {
    display: flex;
    gap: 8px;
    align-items: stretch;
    margin-bottom: 8px;
  }
  .preset-name-input {
    flex: 1 1 auto;
    width: auto;
    min-width: 0;
  }
  .preset-new-btn {
    flex: 0 0 auto;
    white-space: nowrap;
    border: 1px solid var(--border-strong);
    background: var(--ink);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .preset-new-btn:hover { opacity: 0.85; }
  .preset-create-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }
  .preset-status {
    font-size: 11px;
    color: var(--accent);
    font-family: "JetBrains Mono", monospace;
    white-space: nowrap;
  }
  .preset-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 4px;
  }
  .preset-group-label {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--ink-3);
    margin: 10px 0 2px;
  }
  .preset-item {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-2);
  }
  .preset-info { min-width: 0; }
  .preset-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .preset-tag {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    font-weight: 500;
    color: var(--ink-3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .preset-meta {
    font-size: 11px;
    color: var(--ink-3);
    font-family: "JetBrains Mono", monospace;
    margin-top: 3px;
  }
  .preset-actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-chip {
    border: 1px solid var(--border) !important;
    background: var(--surface) !important;
    color: var(--ink-2) !important;
    padding: 5px 12px !important;
    font-size: 12px !important;
    border-radius: 6px !important;
    cursor: pointer;
  }
  .preset-chip:hover { color: var(--ink) !important; border-color: var(--border-strong) !important; }
  .preset-chip-danger:hover { color: var(--warn) !important; border-color: var(--warn) !important; }
  .preset-empty {
    font-size: 12px;
    color: var(--ink-3);
    padding: 6px 2px;
  }
  .preset-hint {
    font-size: 11px;
    color: var(--ink-3);
    line-height: 1.5;
  }

  .stages-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .stage-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    cursor: grab;
  }
  .stage-row.dragging { opacity: 0.4; }
  .stage-row.drag-over { border-color: var(--accent); background: var(--accent-soft); }
  .stage-grip {
    color: var(--ink-3);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    cursor: grab;
    user-select: none;
  }
  .stage-name-input {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--ink);
    font-family: inherit;
    font-size: 13px;
    padding: 4px 6px;
    border-radius: 4px;
    min-width: 0;
  }
  .stage-name-input:focus { outline: 1px solid var(--border-strong); background: var(--surface); }
  .stage-type-pill {
    font-family: "JetBrains Mono", monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-2);
    cursor: pointer;
    text-transform: uppercase;
  }
  .stage-type-pill[data-type="duel"] {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .stage-flow-pill {
    font-family: inherit;
    font-size: 9px;
    letter-spacing: 0.08em;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink-2);
    cursor: pointer;
    white-space: nowrap;
  }
  .stage-flow-pill[data-flow="solo"] {
    border-style: dashed;
    color: var(--ink);
  }
  .stage-flow-pill:disabled { cursor: default; }
  .stage-dur-input {
    width: 56px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    padding: 4px 6px;
    border-radius: 4px;
    text-align: center;
  }
  .stage-del {
    border: none;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 14px;
  }
  .stage-del:hover { color: var(--warn); background: var(--bg-3); }
  .add-chip {
    border: 1px dashed var(--border-strong);
    background: transparent;
    color: var(--ink-2);
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .add-chip:hover { background: var(--bg-2); color: var(--ink); }

  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--border-strong);
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .switch::after {
    content: "";
    position: absolute;
    left: 2px;
    top: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: white;
    transition: left 0.2s ease;
  }

  .switch.on {
    background: var(--accent);
  }

  .switch.on::after { left: 18px; }

  .overlay {
    position: fixed;
    inset: 0;
    background: oklch(0 0 0 / 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 40;
  }

  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }

  /* Flash on time up */
  .flash {
    position: fixed;
    inset: 0;
    background: var(--warn);
    opacity: 0;
    pointer-events: none;
    z-index: 100;
    transition: opacity 0.15s ease;
  }

  .flash.on { opacity: 0.25; }

  /* Fullscreen tweak */
  :fullscreen header,
  :fullscreen footer {
    padding-left: 60px;
    padding-right: 60px;
  }

  :fullscreen .single-time {
    font-size: clamp(160px, 26vw, 380px);
  }

  @media (max-width: 900px) {
    header, footer { padding: 16px 20px; }
    main { padding: 20px; }
    .brand-sub { display: none; }
    .keyhint { display: none; }
  }


/* vintage-festival-restyle */
:root {
  --vf-paper: #e9e9e7;
  --vf-paper-soft: #f4f4f2;
  --vf-ink: #080808;
  --vf-muted: #414141;
  --vf-faint: #888884;
  --vf-line: #101010;
  --vf-track: #b8b8b3;
  --vf-warn: #b53125;
}

[data-theme="warm"] {
  --bg: var(--vf-paper);
  --bg-2: var(--vf-paper-soft);
  --bg-3: var(--vf-track);
  --surface: var(--vf-paper);
  --border: var(--vf-line);
  --border-strong: var(--vf-line);
  --ink: var(--vf-ink);
  --ink-2: var(--vf-muted);
  --ink-3: var(--vf-faint);
  --accent: var(--vf-ink);
  --accent-soft: transparent;
  --warn: var(--vf-warn);
  --ok: var(--vf-ink);
}

[data-theme="dark"] {
  --vf-paper: #080806;
  --vf-paper-soft: #111009;
  --vf-ink: #ffd93d;
  --vf-muted: #f2c94a;
  --vf-faint: #9a822b;
  --vf-line: #ffd93d;
  --vf-track: #4e4218;
  --vf-warn: #ff6b4a;
  --bg: var(--vf-paper);
  --bg-2: var(--vf-paper-soft);
  --bg-3: var(--vf-track);
  --surface: var(--vf-paper);
  --border: var(--vf-line);
  --border-strong: var(--vf-line);
  --ink: var(--vf-ink);
  --ink-2: var(--vf-muted);
  --ink-3: var(--vf-faint);
  --accent: var(--vf-ink);
  --accent-soft: transparent;
  --warn: var(--vf-warn);
  --ok: var(--vf-ink);
}

[data-theme="paper"] {
  --vf-paper: #0b48a0;
  --vf-paper-soft: #1558b5;
  --vf-ink: #f7fbff;
  --vf-muted: #d8e8ff;
  --vf-faint: #a5c2ee;
  --vf-line: #f7fbff;
  --vf-track: #6f98d3;
  --vf-warn: #ffd93d;
  --bg: var(--vf-paper);
  --bg-2: var(--vf-paper-soft);
  --bg-3: var(--vf-track);
  --surface: var(--vf-paper);
  --border: var(--vf-line);
  --border-strong: var(--vf-line);
  --ink: var(--vf-ink);
  --ink-2: var(--vf-muted);
  --ink-3: var(--vf-faint);
  --accent: var(--vf-ink);
  --accent-soft: transparent;
  --warn: var(--vf-warn);
  --ok: var(--vf-ink);
}

.stage-cover {

.cover-page {
  --cover-bg: var(--vf-ink, var(--ink));
  --cover-fg: var(--vf-paper, var(--bg));
  --cover-muted: color-mix(in oklab, var(--cover-fg) 66%, transparent);
  --cover-faint: color-mix(in oklab, var(--cover-fg) 28%, transparent);
  /* pro/con accents overridden per-theme below so they never match the bg */
  --cover-pro: var(--cover-fg);
  --cover-con: var(--cover-fg);
  width: min(100%, 1280px);
  height: 100%;
  min-height: min(640px, calc(100vh - 230px));

  grid-template-rows: auto auto;
  align-content: center;
  justify-items: center;

  text-align: center;
  padding: clamp(48px, 7vh, 88px) clamp(40px, 6vw, 96px);
  border-radius: clamp(20px, 2vw, 32px);
  background: var(--cover-bg);
  color: var(--cover-fg);
}

/* Per-theme pro/con colors guaranteed to contrast with the inverted cover bg */
[data-theme="warm"] .cover-page { --cover-pro: #5b9dff; --cover-con: #ff7a52; }
[data-theme="dark"] .cover-page { --cover-pro: #1f4fa8; --cover-con: #c4341f; }
[data-theme="paper"] .cover-page { --cover-pro: #0b3a86; --cover-con: #c4341f; }

.cover-head {

  justify-items: center;

}

.cover-visually-hidden {

}

.cover-input {

  font: inherit;
  text-align: center;

  border-radius: 0;
}

.cover-input:hover,

}

.cover-input::placeholder {

/* ================= 外观主题：赛场之夜 / 学院典雅 / 柔光卡片 / 电视转播 / 复古终端 =================
   每套主题只覆盖样式，结构和功能完全共用。颜色先定义 --vf-*，再映射到抽屉等处用的通用变量。 */
body[data-theme="arena"],
body[data-theme="academy"],
body[data-theme="soft"],
body[data-theme="broadcast"],
body[data-theme="terminal"] {
  --bg: var(--vf-paper);
  --bg-2: var(--vf-paper-soft);
  --bg-3: var(--vf-track);
  --surface: var(--vf-paper);
  --border: var(--vf-line);
  --border-strong: var(--vf-line);
  --ink: var(--vf-ink);
  --ink-2: var(--vf-muted);
  --ink-3: var(--vf-faint);
  --accent: var(--vf-ink);
  --accent-soft: transparent;
  --warn: var(--vf-warn);
  --ok: var(--vf-ink);
}

/* 设置里的主题色卡 */
.chip[data-theme="arena"] { background: #0b1020 !important; color: #7fb0ff !important; border-color: #4c8dff !important; }
.chip[data-theme="academy"] { background: #f6f1e7 !important; color: #7a1f2b !important; border-color: #b08d57 !important; }
.chip[data-theme="soft"] { background: #eef0ff !important; color: #5468ff !important; border-color: #c9cffc !important; }
.chip[data-theme="broadcast"] { background: linear-gradient(105deg, #1f5fe0 50%, #e23a2e 50%) !important; color: #fff !important; border-color: #ffd400 !important; }
.chip[data-theme="terminal"] { background: #050a06 !important; color: #39ff88 !important; border-color: #1c5c34 !important; font-family: Consolas, monospace !important; }

/* 1 · 赛场之夜 Arena — 深色赛事记分牌：深蓝夜色底，正方蓝 / 反方橙，数字发光 */
html body[data-theme="arena"] {
  --vf-paper: #0b1020;
  --vf-paper-soft: #141b31;
  --vf-ink: #f2f5ff;
  --vf-muted: #9aa6c8;
  --vf-faint: #5b6690;
  --vf-line: #27314f;
  --vf-track: #232c47;
  --vf-warn: #ffb020;
  --lk-pro: #4c8dff;
  --lk-con: #ff6a45;
  --lk-accent: #7c5cff;
  --lk-num: "Bahnschrift", "DIN Alternate", "Arial Narrow", sans-serif;
  --lk-ui: "Microsoft YaHei UI", "PingFang SC", "Noto Sans SC", sans-serif;
}

html body[data-theme="arena"] {
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(76, 141, 255, 0.18), transparent 60%),
    radial-gradient(1000px 600px at 110% 110%, rgba(255, 106, 69, 0.14), transparent 60%),
    #070a15 !important;
  font-family: var(--lk-ui) !important;
}
html body[data-theme="arena"] .app {
  border: 1px solid #1d2540 !important;
  border-radius: 22px !important;
  background: rgba(11, 16, 32, 0.86) !important;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45) !important;
}

/* brand */
html body[data-theme="arena"] .brand-mark::before, html body[data-theme="arena"] .brand-mark::after {
  font-family: var(--lk-num) !important;
  font-weight: 700 !important;
  color: var(--vf-ink) !important;
}
html body[data-theme="arena"] .brand-mark::after { color: var(--lk-pro) !important; }
html body[data-theme="arena"] .brand::before { background: linear-gradient(90deg, var(--lk-pro), var(--lk-con)) !important; }
html body[data-theme="arena"] .brand::after { background: var(--lk-con) !important; }
html body[data-theme="arena"] .brand-topic { color: var(--vf-muted) !important; font-family: var(--lk-ui) !important; }

/* 环节导航：胶囊色块 */
html body[data-theme="arena"] .mode-tabs {
  background: #0f1528 !important;
  border: 1px solid #1d2540 !important;
  border-radius: 999px !important;
  padding: 5px !important;
  column-gap: 2px !important;
}
html body[data-theme="arena"] .mode-tab {
  border-radius: 999px !important;
  padding: 7px 16px !important;
  color: var(--vf-muted) !important;
  font-weight: 500 !important;
}
html body[data-theme="arena"] .mode-tab:hover { background: #1a2240 !important; color: var(--vf-ink) !important; }
html body[data-theme="arena"] .mode-tab.active {
  background: linear-gradient(135deg, var(--lk-pro), var(--lk-accent)) !important;
  color: #fff !important;
  box-shadow: 0 6px 18px rgba(76, 141, 255, 0.35) !important;
}
html body[data-theme="arena"] .icon-btn { color: var(--vf-muted) !important; }

/* 单计时 */
html body[data-theme="arena"] .single-label {
  color: var(--vf-muted) !important;
  font-size: clamp(20px, 2.2vw, 30px) !important;
  font-weight: 500 !important;
}
html body[data-theme="arena"] .single-time {
  font-family: var(--lk-num) !important;
  font-weight: 700 !important;
  font-stretch: 87.5%;
  color: #fff !important;
  font-size: clamp(120px, 17vw, 250px) !important;
  text-shadow: 0 0 40px rgba(76, 141, 255, 0.45), 0 0 2px rgba(255, 255, 255, 0.6) !important;
  border: 0 !important;
}
html body[data-theme="arena"] .progress-meta { color: var(--vf-faint) !important; }
html body[data-theme="arena"] .progress-bar, html body[data-theme="arena"] .duel-progress {
  height: 6px !important;
  border-radius: 999px !important;
  background: var(--vf-track) !important;
}
html body[data-theme="arena"] .progress-fill {
  border-radius: 999px !important;
  background: linear-gradient(90deg, var(--lk-pro), var(--lk-accent)) !important;
  box-shadow: 0 0 14px rgba(124, 92, 255, 0.6) !important;
}

/* 按钮 */
html body[data-theme="arena"] .btn, html body[data-theme="arena"] .timer-action-btn {
  border: 1px solid #27314f !important;
  border-radius: 999px !important;
  padding: 7px 18px !important;
  color: var(--vf-ink) !important;
  background: #121a30 !important;
}
html body[data-theme="arena"] .btn:hover, html body[data-theme="arena"] .timer-action-btn:hover { background: #1b2544 !important; color: #fff !important; }
html body[data-theme="arena"] .btn-primary {
  border: 0 !important;
  background: linear-gradient(135deg, var(--lk-pro), var(--lk-accent)) !important;
  color: #fff !important;
  min-width: 110px !important;
  box-shadow: 0 8px 22px rgba(76, 141, 255, 0.35) !important;
}
html body[data-theme="arena"] .btn-primary:hover { background: linear-gradient(135deg, #6aa1ff, #9277ff) !important; color: #fff !important; }

/* 环节进度 */
html body[data-theme="arena"] .flow-label { color: var(--vf-muted) !important; }

/* 5 · 复古终端 Terminal — 黑底荧光绿等宽字、扫描线、方括号标签，极客感 */

  <div class="flash" id="flash"></div>
<script>
(() => {
'use strict';

/* ============================================================
     Debate Timer — core logic
     ============================================================ */
  const DEFAULT_STAGES = [
    { id: 'cover', name: '\u9996\u9875', type: 'cover', duration: 0 },
    { id: 's1', name: '\u6b63\u65b9\u9648\u8bcd', type: 'single', duration: 180 },
    { id: 's2', name: '\u53cd\u65b9\u8d28\u8be2', type: 'single', duration: 90 },
    { id: 's3', name: '\u53cd\u65b9\u9648\u8bcd', type: 'single', duration: 180 },
    { id: 's4', name: '\u5bf9\u8fa9', type: 'duel', duration: 120 },
    { id: 's5', name: '\u6b63\u65b9\u9648\u8bcd', type: 'single', duration: 180 },
    { id: 's6', name: '\u81ea\u7531\u8fa9\u8bba', type: 'duel', duration: 240 },
    { id: 's7', name: '\u7ed3\u8fa9', type: 'single', duration: 240 },
  ];

  // Built-in competition formats (selectable from the drawer, not deletable)
  const BUILT_IN_PRESETS = [
    {
      name: '华中杯',
      stages: [
        { name: '一辩申论', type: 'single', duration: 240 },
        { name: '二辩质询', type: 'single', duration: 180 },
        { name: '一辩申论', type: 'single', duration: 240 },
        { name: '三辩质询', type: 'single', duration: 180 },
        { name: '二辩申论', type: 'single', duration: 240 },
        { name: '三辩质询', type: 'single', duration: 180 },
        { name: '二辩申论', type: 'single', duration: 240 },
        { name: '一辩质询', type: 'single', duration: 180 },
        { name: '三辩申论', type: 'single', duration: 240 },
        { name: '一辩质询', type: 'single', duration: 180 },
        { name: '三辩申论', type: 'single', duration: 240 },
        { name: '二辩质询', type: 'single', duration: 180 },
        { name: '中休', type: 'single', duration: 120 },
        { name: '结辩', type: 'single', duration: 240 },
        { name: '结辩', type: 'single', duration: 240 },
      ],
    },
    {
      name: '世界杯',
      stages: [
        { name: '正一发言', type: 'single', duration: 180 },
        { name: '反二质询', type: 'single', duration: 90 },
        { name: '反一发言', type: 'single', duration: 180 },
        { name: '正二质询', type: 'single', duration: 90 },
        { name: '反二小结', type: 'single', duration: 120 },
        { name: '正二小结', type: 'single', duration: 120 },
        { name: '四辩对辩', type: 'duel', duration: 90 },
        { name: '正三盘问', type: 'single', duration: 90 },
        { name: '反三盘问', type: 'single', duration: 90 },
        { name: '正三小结', type: 'single', duration: 120 },
        { name: '反三小结', type: 'single', duration: 120 },
        { name: '自由辩论', type: 'duel', duration: 180 },
        { name: '反四总结', type: 'single', duration: 210 },
        { name: '正四总结', type: 'single', duration: 210 },
      ],
    },
    {
      name: '马中辩',
      stages: [
        { name: '正一立论', type: 'single', duration: 180 },
        { name: '反一立论', type: 'single', duration: 180 },
        { name: '反二质询', type: 'single', duration: 120 },
        { name: '正二质询', type: 'single', duration: 120 },
        { name: '反二申论', type: 'single', duration: 180 },
        { name: '正二申论', type: 'single', duration: 180 },
        { name: '一辩对辩', type: 'duel', duration: 120 },
        { name: '正三申论', type: 'duel', duration: 120 },
        { name: '反三申论', type: 'duel', duration: 120 },
        { name: '自由辩论', type: 'duel', duration: 180 },
        { name: '反三结辩', type: 'single', duration: 180 },
        { name: '正三结辩', type: 'single', duration: 180 },
      ],
    },
  ];

  /* ---------------- Duel flow (双计时环节的结束行为) ----------------
     'relay' 交锋：一方归零后自动接续对方，适合自由辩、对辩、攻辩。
     'solo'  独立：一方归零后停下，对方剩余时间原地保留，适合质询、申论。
     stg.duelFlow 只有用户手动切过才会写进环节对象；没写就按环节名推断，
     所以改名之后默认值会跟着改，手动设过的则一直保留。            */
  const DUEL_FLOWS = ['relay', 'solo'];
  const SOLO_NAME_HINTS = ['质询', '申论', '陈词', '陈述', '立论', '小结', '结辩', '总结', '驳论', '盘问', '答辩'];
  const RELAY_NAME_HINTS = ['自由辩', '对辩', '攻辩', '交锋', '混战', '缠斗'];

  function inferDuelFlow(name) {
    const n = String(name || '');
    // 先判独立：'攻辩小结'、'质询小结' 这类名字两边关键词都命中，应当算独立
    if (SOLO_NAME_HINTS.some(k => n.includes(k))) return 'solo';
    if (RELAY_NAME_HINTS.some(k => n.includes(k))) return 'relay';
    return 'relay';
  }
  function isDuelFlow(v) { return DUEL_FLOWS.indexOf(v) >= 0; }
  function duelFlowOf(stg) {
    if (!stg) return 'relay';
    return isDuelFlow(stg.duelFlow) ? stg.duelFlow : inferDuelFlow(stg.name);
  }
  function duelFlowLabel(flow) { return flow === 'solo' ? '独立' : '交锋'; }
  function duelFlowTitle(flow) {
    return flow === 'solo'
      ? '独立计时：一方归零后停下，对方剩余时间原地保留（质询、申论）'
      : '交锋计时：一方归零后自动接续对方（自由辩、对辩）';
  }

  // Per-stage runtime cache: stageId -> { remaining, duelPro, duelCon, duelActive }
  const runtimeCache = {};
  function getRuntime(id) {
    if (!runtimeCache[id]) {
      const stg = state.stages.find(s => s.id === id);
      if (!stg) return null;
      runtimeCache[id] = stg.type === 'duel'
        ? { duelPro: stg.duration, duelCon: stg.duration, duelActive: 'pro' }
        : { remaining: stg.duration };
    }
    return runtimeCache[id];
  }

  const state = {
    stages: DEFAULT_STAGES.map(s => ({...s})),
    currentId: 'cover',
    theme: 'arena',
    fontScale: 1,
    sound: true,
    tick: true,
    autoFlow: false,
    proName: '',
    conName: '',
    topic: '',
    matchStage: '',
    // runtime
    running: false,
    remaining: 180,
    duel: { pro: 120, con: 120, active: 'pro' },
    lastTick: 0,
  };

  function curStage() {
    return state.stages.find(s => s.id === state.currentId) || state.stages[0];
  }
  function curMode() { return curStage().type; } // 'single' | 'duel'
  function curDuelFlow() { return duelFlowOf(curStage()); }
  function curDuration() { return curStage().duration; }
  function curName() { return curStage().name; }
  function ensureCoverStage() {
    const base = DEFAULT_STAGES.find(s => s.type === 'cover') || { id: 'cover', name: '\u9996\u9875', type: 'cover', duration: 0 };
    if (!Array.isArray(state.stages)) state.stages = [];
    let coverIndex = state.stages.findIndex(s => s.type === 'cover' || s.id === 'cover');
    let cover = coverIndex >= 0 ? state.stages.splice(coverIndex, 1)[0] : { ...base };
    cover.id = 'cover';
    cover.type = 'cover';
    cover.duration = 0;
    cover.name = cover.name || base.name;
    state.stages = state.stages.map(s => {
      const type = s.type === 'duel' ? 'duel' : (s.type === 'cover' ? 'cover' : 'single');
      const out = {
        ...s,
        type,
        duration: type === 'cover' ? 0 : Math.max(10, Number(s.duration) || 60),
      };
      // 只保留合法的显式设置，其余交给 duelFlowOf() 按环节名推断
      if (!isDuelFlow(out.duelFlow)) delete out.duelFlow;
      return out;
    });
    state.stages.unshift(cover);
  }

  /* ---------------- LocalStorage ---------------- */
  const STORAGE_KEY = 'debate-timer-v2';
  const PRESETS_KEY = 'debate-timer-v2-presets';
  let timerPresets = [];
  function saveState() {
    const s = {
      stages: state.stages, currentId: state.currentId,
      theme: state.theme,
      fontScale: state.fontScale, sound: state.sound, tick: state.tick,
      autoFlow: state.autoFlow, proName: state.proName, conName: state.conName,
      topic: state.topic, matchStage: state.matchStage,
    };
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch (e) {}
  }
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!s) return;
      Object.assign(state, s);
      if (typeof state.matchStage !== 'string') state.matchStage = '2026 \u534e\u4e2d\u676f \u521d\u8d5b';
      if (!Array.isArray(state.stages) || state.stages.length === 0) {
        state.stages = DEFAULT_STAGES.map(x => ({...x}));
        state.currentId = state.stages[0].id;
      }
      ensureCoverStage();
      if (!state.stages.find(x => x.id === state.currentId)) {
        state.currentId = state.stages[0].id;
      }
      delete state['display'];
      delete state['timerScale'];
      saveState();
    } catch (e) {}
  }

  /* ---------------- Audio (WebAudio) ---------------- */
  let audioCtx;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq = 660, duration = 0.12, type = 'sine', gain = 0.15) {
    if (!state.sound) return;
    const ctx = ensureAudio();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(gain, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(g).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.02);
  }
  function beepEnd() {
    if (!state.sound) return;
    beep(880, 0.2, 'sine', 0.2);
    setTimeout(() => beep(660, 0.25, 'sine', 0.2), 220);
    setTimeout(() => beep(440, 0.4, 'sine', 0.2), 480);
    // vibrate if supported
    if (navigator.vibrate) navigator.vibrate([200, 80, 200]);
  }
  function beepTick() {
    if (!state.sound || !state.tick) return;
    beep(880, 0.06, 'square', 0.08);
  }
  function beep30() {
    if (!state.sound) return;
    beep(520, 0.18, 'triangle', 0.12);
  }

  /* ---------------- Rendering ---------------- */
  const stage = document.getElementById('stage');

  function formatTime(sec) {
    const over = sec < 0;
    const abs = Math.abs(sec);
    const m = Math.floor(abs / 60);
    const s = Math.floor(abs % 60);
    return (over ? '-' : '') + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function renderStage() {
    stage.innerHTML = '';
    const mode = curMode();
    document.body.dataset.screen = mode;
    stage.className = 'stage stage-' + mode;
    if (mode === 'cover') {
      renderCover();
    } else if (mode === 'duel') {
      renderDuel();
    } else {
      renderSingle();
    }
    updateTimes();
  }

  function renderCover() {
    stage.innerHTML =
      '<section class="cover-page" aria-label="\u6bd4\u8d5b\u9996\u9875">' +
        '<div class="cover-head">' +
          '<div class="cover-kicker">' +
            '<label class="cover-visually-hidden" for="coverMatchStage">\u6bd4\u8d5b\u8d5b\u6bb5</label>' +

          '</div>' +

  function setFieldValue(id, value) {
    const el = document.getElementById(id);
    if (el && el !== document.activeElement) el.value = value || '';
  }

  function syncCoverFields() {
    setFieldValue('coverMatchStage', state.matchStage || '');
    setFieldValue('coverTopic', state.topic || '');
    setFieldValue('coverProSchool', state.proName || '');
    setFieldValue('coverConSchool', state.conName || '');
  }

  function syncHeaderTopic() {
    setFieldValue('topicInput', state.topic || '');
  }

  function wireCoverInputs() {
    const bind = (id, key, max, after) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', e => {
        state[key] = e.target.value.slice(0, max);
        if (typeof after === 'function') after();
        saveState();
      });
    };
    bind('coverMatchStage', 'matchStage', 40);
    bind('coverTopic', 'topic', 80, () => { syncHeaderTopic(); });
    bind('coverProSchool', 'proName', 32, () => { updateTimes(); applyInputs(); });
    bind('coverConSchool', 'conName', 32, () => { updateTimes(); applyInputs(); });
  }

  
  function renderSingle() {
    const total = curDuration();
    const name = curName();
    stage.innerHTML = `
      <div class="single-timer">
        <div class="single-label">${name}</div>
        <div class="single-time editable-time" id="timeDisplay" data-target="single">${formatTime(state.remaining)}</div>
        <div class="progress-wrap">
          <div class="progress-meta">
            <span id="elapsedLabel">已用 00:00</span>
            <span id="totalLabel">共 ${formatTime(total)}</span>
          </div>

            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            重置

    document.getElementById('btnResetSingle').addEventListener('click', () => {

  function wireEditableTime() {
    document.querySelectorAll('.editable-time').forEach(el => {
      el.addEventListener('click', () => startEditTime(el));
    });
  }

  function startEditTime(el) {
    if (state.running) return;
    const target = el.dataset.target; // single | pro | con
    const cur = target === 'single' ? state.remaining
              : target === 'pro' ? state.duel.pro : state.duel.con;
    const initial = formatTime(Math.max(0, Math.ceil(cur)));
    el.classList.add('editing');
    const orig = el.textContent;
    el.contentEditable = 'true';
    el.textContent = initial;
    const range = document.createRange();
    range.selectNodeContents(el);
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    el.focus();
    const finish = (commit) => {
      el.contentEditable = 'false';
      el.classList.remove('editing');
      el.removeEventListener('blur', onBlur);
      el.removeEventListener('keydown', onKey);
      if (commit) {
        const v = parseTimeStr(el.textContent.trim());
        if (v != null && v >= 0) {
          // update both duration of stage and remaining
          const stg = curStage();
          stg.duration = Math.max(10, v || 10);
          if (target === 'single') state.remaining = v;
          else if (target === 'pro') state.duel.pro = v;
          else if (target === 'con') state.duel.con = v;
          // refresh runtime cache
          getRuntime(stg.id);
          if (stg.type === 'duel') {
            runtimeCache[stg.id].duelPro = state.duel.pro;
            runtimeCache[stg.id].duelCon = state.duel.con;
          } else {
            runtimeCache[stg.id].remaining = state.remaining;
          }
          saveState();
          renderStagesList();
          renderStage();
          return;
        }
      }
      el.textContent = orig;
    };
    const onBlur = () => finish(true);
    const onKey = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    };
    el.addEventListener('blur', onBlur);
    el.addEventListener('keydown', onKey);
  }

  function parseTimeStr(s) {
    if (!s) return null;
    s = s.replace(/[–—−]/g, '-').trim();
    if (/^\d+$/.test(s)) return parseInt(s);
    const m = s.match(/^(-?)(\d+):(\d{1,2})$/);
    if (!m) return null;
    const sign = m[1] === '-' ? -1 : 1;
    const min = parseInt(m[2]); const sec = parseInt(m[3]);
    if (sec >= 60) return null;
    return sign * (min * 60 + sec);
  }

  
  
  function renderDuel() {
    const flow = curDuelFlow();
    stage.innerHTML = `
      <div class="duel" id="duel">

          <button class="duel-reset-btn" id="btnResetPro" title="重置正方">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>重置</span>
          </button>
          <div class="duel-progress"><div class="duel-progress-fill" id="proProgress" style="width:100%"></div></div>
        </div>
        <div class="duel-panel inactive" data-side="con" id="panelCon">
          <div class="duel-side">
            <div class="duel-side-label">B · 反方</div>
            <div class="duel-side-name" id="conNameEl">\u53cd\u65b9</div>
            <div class="duel-status">待命</div>
          </div>
          <div class="duel-time editable-time" id="conTime" data-target="con">${formatTime(state.duel.con)}</div>
          <button class="duel-reset-btn" id="btnResetCon" title="重置反方">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>重置</span>
          </button>
          <div class="duel-progress"><div class="duel-progress-fill" id="conProgress" style="width:100%"></div></div>
        </div>
        <button class="duel-divider" id="duelFlowToggle" data-flow="${flow}" title="${duelFlowTitle(flow)}（点击切换）">${duelFlowLabel(flow)}</button>
      </div>`;
    // 交锋 / 独立：在计时页直接点中间的圆钮切换，不用进设置
    document.getElementById('duelFlowToggle').addEventListener('click', (e) => {
      e.stopPropagation();
      e.currentTarget.blur(); // 避免之后按空格/回车又触发一次切换
      toggleDuelFlow(curStage());
    });
    document.getElementById('panelPro').addEventListener('click', (e) => {
      if (e.target.closest('.duel-reset-btn') || e.target.closest('.editable-time')) return;
      if (curMode() !== 'duel') return;
      if (!state.running) { state.duel.active = 'pro'; toggleRun(); }
      else { state.duel.active = state.duel.active === 'pro' ? 'con' : 'pro'; }
      updateDuelActive();
    });
    document.getElementById('panelCon').addEventListener('click', (e) => {
      if (e.target.closest('.duel-reset-btn') || e.target.closest('.editable-time')) return;
      if (curMode() !== 'duel') return;
      if (!state.running) { state.duel.active = 'con'; toggleRun(); }
      else { state.duel.active = state.duel.active === 'pro' ? 'con' : 'pro'; }
      updateDuelActive();
    });
    document.getElementById('btnResetPro').addEventListener('click', (e) => {
      e.stopPropagation();
      state.duel.pro = curDuration();
      const rt = getRuntime(curStage().id);
      if (rt) rt.duelPro = state.duel.pro;
      updateTimes();
      updateDuelActive();
    });
    document.getElementById('btnResetCon').addEventListener('click', (e) => {
      e.stopPropagation();
      state.duel.con = curDuration();
      const rt = getRuntime(curStage().id);
      if (rt) rt.duelCon = state.duel.con;
      updateTimes();
      updateDuelActive();
    });
    wireEditableTime();
    // 恢复缓存里的当前方 / 已结束状态，而不是永远显示正方在跑
    updateDuelActive();
  }

  function updateDuelActive() {
    const pro = document.getElementById('panelPro');
    const con = document.getElementById('panelCon');
    if (!pro || !con) return;
    const activeSide = state.duel.active === 'con' ? 'con' : 'pro';
    const otherSide = activeSide === 'pro' ? 'con' : 'pro';
    const activeEl = activeSide === 'pro' ? pro : con;
    const otherEl = activeSide === 'pro' ? con : pro;
    activeEl.classList.add('active'); activeEl.classList.remove('inactive');
    otherEl.classList.add('inactive'); otherEl.classList.remove('active');
    activeEl.querySelector('.duel-status').textContent =
      state.duel[activeSide] <= 0 ? '已结束' : '计时中';
    otherEl.querySelector('.duel-status').textContent =
      state.duel[otherSide] <= 0 ? '已结束' : (state.running ? '暂停中' : '待命');
  }

  
  function updateTimes() {
    if (curMode() === 'cover') {
      syncCoverFields();
      syncHeaderTopic();
      return;
    }
    if (curMode() === 'duel') {
      const proEl = document.getElementById('proTime');
      const conEl = document.getElementById('conTime');
      const proProg = document.getElementById('proProgress');
      const conProg = document.getElementById('conProgress');
      const total = curDuration();
      if (proEl && !proEl.classList.contains('editing')) {
        proEl.textContent = formatTime(state.duel.pro);
        proEl.className = 'duel-time editable-time' + warnClass(state.duel.pro, total);
      }
      if (conEl && !conEl.classList.contains('editing')) {
        conEl.textContent = formatTime(state.duel.con);
        conEl.className = 'duel-time editable-time' + warnClass(state.duel.con, total);
      }
      if (proProg) proProg.style.width = Math.max(0, state.duel.pro / total * 100) + '%';
      if (conProg) conProg.style.width = Math.max(0, state.duel.con / total * 100) + '%';
      const proName = document.getElementById('proNameEl');
      const conName = document.getElementById('conNameEl');
      if (proName) proName.textContent = '\u6b63\u65b9';
      if (conName) conName.textContent = '\u53cd\u65b9';
    } else {
      const total = curDuration();
      const disp = document.getElementById('timeDisplay');
      if (disp && !disp.classList.contains('editing')) {
        disp.textContent = formatTime(state.remaining);
        disp.className = 'single-time editable-time' + warnClass(state.remaining, total);
      }
      const fill = document.getElementById('progressFill');
      if (fill) {
        fill.style.width = Math.max(0, state.remaining / total * 100) + '%';
        fill.className = 'progress-fill' + (state.remaining <= 30 && state.remaining > 0 ? ' warning' : '');
      }
      const elapsed = document.getElementById('elapsedLabel');
      if (elapsed) elapsed.textContent = '\u5df2\u7528 ' + formatTime(total - Math.max(0, state.remaining));
    }
  }

  function warnClass(sec, total) {
    if (sec <= 0) return ' overtime';
    if (sec <= 30) return ' warning';
    return '';
  }

  /* ---------------- Tick loop ---------------- */
  let rafId = null;
  function loop(ts) {
    if (!state.running) { rafId = null; return; }
    if (!state.lastTick) state.lastTick = ts;
    const delta = (ts - state.lastTick) / 1000;
    state.lastTick = ts;

    let prevWhole;
    if (curMode() === 'duel') {
      const k = state.duel.active;
      if (state.duel[k] <= 0) {
        // 运行中切到了已归零的一方：不倒扣，按 duelFlow 接续或停下
        handleTimeUp();
      } else {
        prevWhole = Math.ceil(state.duel[k]);
        state.duel[k] = Math.max(0, state.duel[k] - delta);
        checkBeeps(prevWhole, state.duel[k], curDuration());
      }
    } else {
      prevWhole = Math.ceil(state.remaining);
      state.remaining = Math.max(0, state.remaining - delta);
      checkBeeps(prevWhole, state.remaining, curDuration());
    }
    updateTimes();
    if (!state.running) { rafId = null; return; }
    rafId = requestAnimationFrame(loop);
  }

  function checkBeeps(prev, now, total) {
    const prevSec = Math.ceil(prev);
    const nowSec = Math.ceil(now);
    if (prevSec === nowSec) return;
    // 30s warning
    if (prevSec === 31 && nowSec <= 30 && nowSec > 0) {
      beep30();
    }
    // last 10s ticks
    if (nowSec <= 10 && nowSec > 0 && prevSec !== nowSec) {
      beepTick();
    }
    // zero
    if (prevSec > 0 && nowSec <= 0) {
      beepEnd();
      flashScreen();
      handleTimeUp();
    }
  }

  function handleTimeUp() {
    if (curMode() === 'duel') {
      const other = state.duel.active === 'pro' ? 'con' : 'pro';
      if (curDuelFlow() === 'relay' && state.duel[other] > 0) {
        // 交锋：自动接续还有时间的一方，整体继续跑
        state.duel.active = other;
        updateDuelActive();
        updateTimes();
      } else {
        // 独立：停下，对方剩余时间原地保留，要用时点它或按 1/2 再开始
        state.running = false;
        updateStartButton();
        updateDuelActive();
      }
    } else {
      state.running = false;
      updateStartButton();
      if (state.autoFlow) {
        setTimeout(() => nextStage(), 1200);
      }
    }
  }

  function flashScreen() {
    const f = document.getElementById('flash');
    f.classList.add('on');
    setTimeout(() => f.classList.remove('on'), 180);
    setTimeout(() => f.classList.add('on'), 320);
    setTimeout(() => f.classList.remove('on'), 520);
  }

  /* ---------------- Controls ---------------- */
  function activeRemaining() {
    return curMode() === 'duel' ? state.duel[state.duel.active] : state.remaining;
  }

  function toggleRun() {
    if (curMode() === 'cover') return;
    ensureAudio();
    // 时间到后不再继续计时：已归零的计时器不能再开始，只能重置
    if (!state.running && activeRemaining() <= 0) { updateStartButton(); return; }
    state.running = !state.running;
    state.lastTick = 0;
    if (state.running && !rafId) rafId = requestAnimationFrame(loop);
    updateStartButton();
    if (curMode() === 'duel') updateDuelActive();
  }

  function resetTimer() {
    state.running = false;
    updateStartButton();
    if (curMode() === 'cover') {
      updateTimes();
      return;
    }
    if (curMode() === 'duel') {
      state.duel.pro = curDuration();
      state.duel.con = curDuration();
      state.duel.active = 'pro';
      const rt = getRuntime(curStage().id);
      rt.duelPro = state.duel.pro; rt.duelCon = state.duel.con; rt.duelActive = 'pro';
    } else {
      state.remaining = curDuration();
      const rt = getRuntime(curStage().id);
      rt.remaining = state.remaining;
    }
    updateTimes();
    if (curMode() === 'duel') updateDuelActive();
  }

  function setCurrent(id) {
    if (!state.stages.find(s => s.id === id)) return;
    // Save current runtime to cache
    saveCurrentRuntime();
    state.currentId = id;
    state.running = false;
    // Restore from cache (preserves remaining)
    const rt = getRuntime(id);
    if (curMode() === 'cover') {
      state.remaining = 0;
    } else if (curMode() === 'duel') {
      state.duel.pro = rt.duelPro;
      state.duel.con = rt.duelCon;
      state.duel.active = rt.duelActive || 'pro';
    } else {
      state.remaining = rt.remaining;
    }
    renderModeTabs();
    renderStage();
    updateStartButton();
    updateFlowDots();
    saveState();
  }

  function saveCurrentRuntime() {
    const id = state.currentId;
    const rt = getRuntime(id);
    if (!rt) return;
    if (curMode() === 'cover') {
      return;
    }
    if (curMode() === 'duel') {
      rt.duelPro = state.duel.pro;
      rt.duelCon = state.duel.con;
      rt.duelActive = state.duel.active;
    } else {
      rt.remaining = state.remaining;
    }
  }

  function nextStage() {
    const i = state.stages.findIndex(s => s.id === state.currentId);
    const n = (i + 1) % state.stages.length;
    setCurrent(state.stages[n].id);
  }
  function prevStage() {
    const i = state.stages.findIndex(s => s.id === state.currentId);
    const n = (i - 1 + state.stages.length) % state.stages.length;
    setCurrent(state.stages[n].id);
  }

  function renderModeTabs() {
    const tabs = document.getElementById('modeTabs');
    tabs.innerHTML = '';
    state.stages.forEach(s => {
      const b = document.createElement('button');
      b.className = 'mode-tab' + (s.id === state.currentId ? ' active' : '');
      b.dataset.id = s.id;
      b.textContent = s.name;
      if (s.type === 'duel') b.title = '双计时 · ' + duelFlowTitle(duelFlowOf(s));
      tabs.appendChild(b);
    });
  }

  function updateStartButton() {
    const label = document.getElementById('startLabel');
    const icon = document.getElementById('iconPlay');
    const btn = document.getElementById('btnStart');
    if (curMode() === 'cover') {
      if (btn) { btn.disabled = true; btn.classList.add('disabled'); }
      label.textContent = '\u65e0\u8ba1\u65f6';
      icon.innerHTML = '<path d="M5 12h14"/>';
      return;
    }
    if (btn) { btn.disabled = false; btn.classList.remove('disabled'); }
    if (state.running) {
      label.textContent = '\u6682\u505c';
      icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
      label.textContent = state.remaining <= 0 && curMode() !== 'duel' ? '\u5df2\u7ed3\u675f' : '\u5f00\u59cb';
      icon.innerHTML = '<polygon points="6 4 20 12 6 20 6 4"/>';
    }
  }

  function updateFlowDots() {
    const dots = document.getElementById('flowDots');
    dots.innerHTML = '';
    const curIdx = state.stages.findIndex(s => s.id === state.currentId);
    state.stages.forEach((stg, i) => {
      const d = document.createElement('div');
      d.className = 'flow-dot' + (i === curIdx ? ' current' : i < curIdx ? ' done' : '');
      d.title = stg.name;
      dots.appendChild(d);
    });
    const ft = document.getElementById('flowText');
    if (ft) ft.textContent = '流程：' + state.stages.map(s => s.name).join(' → ');
  }

  // pill: 从设置抽屉点的就只同步那一个 pill；从计时页点的则重绘抽屉列表
  function toggleDuelFlow(stg, pill) {
    if (!stg || stg.type !== 'duel') return;
    stg.duelFlow = duelFlowOf(stg) === 'solo' ? 'relay' : 'solo';
    const flow = duelFlowOf(stg);
    const btn = stg.id === state.currentId && document.getElementById('duelFlowToggle');
    if (btn) {
      btn.dataset.flow = flow;
      btn.textContent = duelFlowLabel(flow);
      btn.title = duelFlowTitle(flow) + '（点击切换）';
    }
    if (pill) syncFlowPill(pill, stg);
    else renderStagesList();
    renderModeTabs();
    saveState();
  }

  /* ---------------- Stages drawer list ---------------- */
  function syncFlowPill(pill, stg) {
    if (!pill) return;
    const isDuel = stg.type === 'duel';
    const flow = duelFlowOf(stg);
    pill.dataset.flow = flow;
    pill.textContent = duelFlowLabel(flow);
    pill.disabled = !isDuel;
    pill.title = isDuel ? duelFlowTitle(flow) : '';
    // 单计时 / 首页保留占位，避免各行宽度跳动
    pill.style.visibility = isDuel ? 'visible' : 'hidden';
  }

  function renderStagesList() {
    const list = document.getElementById('stagesList');
    list.innerHTML = '';
    state.stages.forEach((stg, idx) => {
      const isCover = stg.type === 'cover';
      const row = document.createElement('div');
      row.className = 'stage-row';
      row.draggable = true;
      row.dataset.idx = idx;
      row.innerHTML = `
        <span class="stage-grip">⋮⋮</span>
        <input class="stage-name-input" value="${stg.name.replace(/"/g, '&quot;')}" maxlength="10">
        <button class="stage-type-pill" data-type="${stg.type}" title="${isCover ? '\u9996\u9875\u4e0d\u53c2\u4e0e\u8ba1\u65f6' : '\u5207\u6362\u7c7b\u578b'}" ${isCover ? 'disabled' : ''}>${isCover ? '\u9996\u9875' : (stg.type === 'duel' ? '\u53cc' : '\u5355')}</button>
        <button class="stage-flow-pill"></button>
        <input type="number" class="stage-dur-input" value="${stg.duration}" min="0" step="10" ${isCover ? 'disabled' : ''}>
        <span style="font-size:10px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;">s</span>
        <button class="stage-del" title="\u5220\u9664" ${isCover ? 'disabled' : ''}>\u00d7</button>
      `;
      const flowPill = row.querySelector('.stage-flow-pill');
      syncFlowPill(flowPill, stg);
      // name
      row.querySelector('.stage-name-input').addEventListener('input', (e) => {
        stg.name = e.target.value.slice(0, 10) || '环节';
        // 没手动设过交锋/独立的环节，默认值跟着名字走
        syncFlowPill(flowPill, stg);
        renderModeTabs(); updateFlowDots();
        if (stg.id === state.currentId) renderStage();
        saveState();
      });
      // 交锋 / 独立 toggle
      flowPill.addEventListener('click', () => toggleDuelFlow(stg, flowPill));
      // type toggle
      row.querySelector('.stage-type-pill').addEventListener('click', (e) => {
        if (stg.type === 'cover') return;
        stg.type = stg.type === 'duel' ? 'single' : 'duel';
        delete runtimeCache[stg.id];
        renderStagesList(); renderModeTabs(); updateFlowDots();
        if (stg.id === state.currentId) { resetTimer(); renderStage(); }
        saveState();
      });
      // duration
      row.querySelector('.stage-dur-input').addEventListener('change', (e) => {
        if (stg.type === 'cover') return;
        const v = Math.max(10, parseInt(e.target.value) || 10);
        stg.duration = v; e.target.value = v;
        // invalidate cache so the new duration takes effect
        delete runtimeCache[stg.id];
        if (stg.id === state.currentId && !state.running) { resetTimer(); renderStage(); }
        saveState();
      });
      // delete
      row.querySelector('.stage-del').addEventListener('click', () => {
        if (stg.type === 'cover') return;
        if (state.stages.length <= 1) return;
        const wasCurrent = stg.id === state.currentId;
        state.stages = state.stages.filter(s => s.id !== stg.id);
        if (wasCurrent) state.currentId = state.stages[0].id;
        renderStagesList(); renderModeTabs(); updateFlowDots();
        if (wasCurrent) { resetTimer(); renderStage(); }
        saveState();
      });
      // drag
      row.addEventListener('dragstart', (e) => {
        row.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
      });
      row.addEventListener('dragend', () => row.classList.remove('dragging'));
      row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('drag-over'); });
      row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
      row.addEventListener('drop', (e) => {
        e.preventDefault();
        row.classList.remove('drag-over');
        const from = parseInt(e.dataTransfer.getData('text/plain'));
        const to = idx;
        if (from === to) return;
        const item = state.stages.splice(from, 1)[0];
        state.stages.splice(to, 0, item);
        ensureCoverStage();
        renderStagesList(); renderModeTabs(); updateFlowDots();
        saveState();
      });
      list.appendChild(row);
    });
  }

  function addStage(name, type, dur) {
    const id = 's' + Date.now() + Math.floor(Math.random()*1000);
    state.stages.push({ id, name, type, duration: dur });
    ensureCoverStage();
    renderStagesList(); renderModeTabs(); updateFlowDots();
    saveState();
  }

  /* ---------------- Preset storage ---------------- */
  function clearRuntimeCache() {
    Object.keys(runtimeCache).forEach(k => delete runtimeCache[k]);
  }

  function cloneStages(stages) {
    return stages.map(s => {
      const out = { id: s.id, name: s.name, type: s.type, duration: s.duration };
      if (isDuelFlow(s.duelFlow)) out.duelFlow = s.duelFlow;
      return out;
    });
  }

  function loadTimerPresets() {
    try {
      const data = JSON.parse(localStorage.getItem(PRESETS_KEY) || '[]');
      return Array.isArray(data) ? data.slice(0, 3) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTimerPresets() {
    try { localStorage.setItem(PRESETS_KEY, JSON.stringify(timerPresets.slice(0, 3))); } catch (e) {}
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[ch]));
  }

  function currentPresetSnapshot(name) {
    return {
      id: 'p' + Date.now() + Math.floor(Math.random() * 1000),
      name,
      currentId: state.currentId,
      stages: cloneStages(state.stages),
      savedAt: Date.now(),
    };
  }

  function setPresetStatus(text) {
    const el = document.getElementById('presetStatus');
    if (!el) return;
    el.textContent = text || '';
    if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 1800);
  }

  function renderPresetList() {
    const list = document.getElementById('presetList');
    if (!list) return;
    list.innerHTML = '';

    const makeItem = (preset, builtin) => {
      const item = document.createElement('div');
      item.className = 'preset-item' + (builtin ? ' preset-item-builtin' : '');
      // 双计时环节正反方各有一份时长，总时长要算两次
      const totalSeconds = preset.stages.reduce((sum, stg) => sum + (Number(stg.duration) || 0) * (stg.type === 'duel' ? 2 : 1), 0);
      const tag = builtin ? ' <span class="preset-tag">内置</span>' : '';
      let actions = '<button class="chip preset-chip" data-action="load">套用</button>';
      if (!builtin) {
        actions += '<button class="chip preset-chip" data-action="rename">改名</button>' +
                   '<button class="chip preset-chip" data-action="update">更新</button>' +
                   '<button class="chip preset-chip preset-chip-danger" data-action="delete">删除</button>';
      }
      item.innerHTML = '<div class="preset-info">' +
        '<div class="preset-title">' + escapeHtml(preset.name) + tag + '</div>' +
        '<div class="preset-meta">' + preset.stages.length + ' 环节 · ' + formatTime(totalSeconds) + '</div>' +
        '</div>' +
        '<div class="preset-actions">' + actions + '</div>';
      const on = (act, fn) => { const b = item.querySelector('[data-action="' + act + '"]'); if (b) b.addEventListener('click', fn); };
      if (builtin) {
        on('load', () => loadBuiltInPreset(preset.name));
      } else {
        on('load', () => loadTimerPreset(preset.id));
        on('rename', () => renameTimerPreset(preset.id));
        on('update', () => updateTimerPreset(preset.id));
        on('delete', () => deleteTimerPreset(preset.id));
      }
      return item;
    };

    const label = (text) => {
      const el = document.createElement('div');
      el.className = 'preset-group-label';
      el.textContent = text;
      list.appendChild(el);
    };

    label('内置赛制');
    BUILT_IN_PRESETS.forEach(p => list.appendChild(makeItem(p, true)));

    label('我的计时器 (' + timerPresets.length + '/3)');
    if (timerPresets.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'preset-empty';
      empty.textContent = '还没有。设置好环节后，点上方「新建」保存为计时器。';
      list.appendChild(empty);
    } else {
      timerPresets.forEach(p => list.appendChild(makeItem(p, false)));
    }
  }

  function saveTimerPresetFromInput() {
    const input = document.getElementById('presetNameInput');
    const name = (input ? input.value : '').trim();
    if (!name) { setPresetStatus('先输入名称'); return; }
    const existing = timerPresets.find(p => p.name === name);
    if (existing) {
      existing.currentId = state.currentId;
      existing.stages = cloneStages(state.stages);
      existing.savedAt = Date.now();
      setPresetStatus('已修改');
    } else {
      if (timerPresets.length >= 3) { setPresetStatus('最多 3 个'); return; }
      timerPresets.push(currentPresetSnapshot(name));
      setPresetStatus('已保存');
    }
    if (input) input.value = '';
    saveTimerPresets();
    renderPresetList();
  }

  function applyStageSet(stages, label) {
    state.running = false;
    const base = Date.now();
    state.stages = stages.map((st, i) => {
      const out = {
        id: 'b' + base + '_' + i,
        name: st.name, type: st.type, duration: st.duration,
      };
      if (isDuelFlow(st.duelFlow)) out.duelFlow = st.duelFlow;
      return out;
    });
    ensureCoverStage();
    state.currentId = state.stages[0].id;
    clearRuntimeCache();
    resetTimer();
    renderStagesList();
    renderModeTabs();
    renderStage();
    updateFlowDots();
    updateStartButton();
    saveState();
    setPresetStatus(label ? ('已套用 ' + label) : '已套用');
  }

  function loadBuiltInPreset(name) {
    const preset = BUILT_IN_PRESETS.find(p => p.name === name);
    if (!preset) return;
    applyStageSet(preset.stages, preset.name);
  }

  function loadTimerPreset(id) {
    const preset = timerPresets.find(p => p.id === id);
    if (!preset) return;
    state.running = false;
    state.stages = cloneStages(preset.stages);
    ensureCoverStage();
    state.currentId = state.stages.find(s => s.id === preset.currentId) ? preset.currentId : state.stages[0].id;
    clearRuntimeCache();
    resetTimer();
    renderStagesList();
    renderModeTabs();
    renderStage();
    updateFlowDots();
    updateStartButton();
    saveState();
    setPresetStatus('已套用');
  }

  function updateTimerPreset(id) {
    const preset = timerPresets.find(p => p.id === id);
    if (!preset) return;
    preset.currentId = state.currentId;
    preset.stages = cloneStages(state.stages);
    preset.savedAt = Date.now();
    saveTimerPresets();
    renderPresetList();
    setPresetStatus('已修改');
  }

  function renameTimerPreset(id) {
    const preset = timerPresets.find(p => p.id === id);
    if (!preset) return;
    const name = (window.prompt('计时器名称', preset.name) || '').trim();
    if (!name) return;
    preset.name = name.slice(0, 24);
    saveTimerPresets();
    renderPresetList();
    setPresetStatus('已改名');
  }

  function deleteTimerPreset(id) {
    timerPresets = timerPresets.filter(p => p.id !== id);
    saveTimerPresets();
    renderPresetList();
    setPresetStatus('已删除');
  }

  /* ---------------- Drawer ---------------- */
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('overlay');
  function openDrawer() { drawer.classList.add('open'); overlay.classList.add('show'); }
  function closeDrawer() { drawer.classList.remove('open'); overlay.classList.remove('show'); }

  /* ---------------- Theme + font ---------------- */
  const THEMES = ['arena', 'academy', 'soft', 'broadcast', 'terminal'];
  function applyTheme() {
    // 旧版的 warm / dark / paper 已下线，存档里的旧值统一落到默认主题
    if (THEMES.indexOf(state.theme) < 0) state.theme = THEMES[0];
    document.body.dataset.theme = state.theme;
    document.documentElement.style.setProperty('--font-scale', state.fontScale);
    document.querySelectorAll('#themeGroup .chip').forEach(c => {
      c.classList.toggle('active', c.dataset.theme === state.theme);
    });
    document.querySelectorAll('#fontGroup .chip').forEach(c => {
      c.classList.toggle('active', parseFloat(c.dataset.scale) === state.fontScale);
    });
  }

  

  function applyInputs() {
    document.getElementById('proName').value = state.proName;
    document.getElementById('conName').value = state.conName;
    document.getElementById('swSound').classList.toggle('on', state.sound);
    document.getElementById('swTick').classList.toggle('on', state.tick);
    document.getElementById('swAutoFlow').classList.toggle('on', state.autoFlow);
    const iconSound = document.getElementById('iconSound');
    const btnSound = document.getElementById('btnSound');
    btnSound.classList.toggle('active', state.sound);
  }

  /* ---------------- Event wiring ---------------- */
  function wire() {
    document.getElementById('modeTabs').addEventListener('click', (e) => {
      const b = e.target.closest('.mode-tab');
      if (b) setCurrent(b.dataset.id);
    });
    document.querySelectorAll('.add-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        addStage(btn.dataset.add, btn.dataset.type, parseInt(btn.dataset.dur));
      });
    });
    document.getElementById('btnStart').addEventListener('click', toggleRun);
    document.getElementById('btnPrev').addEventListener('click', prevStage);
    document.getElementById('btnNext').addEventListener('click', nextStage);
    const topicEl = document.getElementById('topicInput');
    if (topicEl) {
      topicEl.value = state.topic || '';
      topicEl.addEventListener('input', e => { state.topic = e.target.value; syncCoverFields(); saveState(); });
    }
    document.getElementById('btnSettings').addEventListener('click', openDrawer);
    document.getElementById('drawerClose').addEventListener('click', closeDrawer);
    overlay.addEventListener('click', closeDrawer);

    document.getElementById('btnSound').addEventListener('click', () => {
      state.sound = !state.sound;
      applyInputs(); saveState();
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    });

    document.getElementById('themeGroup').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      state.theme = b.dataset.theme;
      applyTheme(); saveState();
    });

    document.getElementById('fontGroup').addEventListener('click', (e) => {
      const b = e.target.closest('.chip');
      if (!b) return;
      state.fontScale = parseFloat(b.dataset.scale);
      applyTheme(); saveState();
    });

    document.getElementById('savePresetBtn').addEventListener('click', saveTimerPresetFromInput);
    document.getElementById('presetNameInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveTimerPresetFromInput();
    });

    document.getElementById('proName').addEventListener('input', (e) => {
      state.proName = e.target.value.slice(0, 20) || '正方';
      updateTimes(); saveState();
    });
    document.getElementById('conName').addEventListener('input', (e) => {
      state.conName = e.target.value.slice(0, 20) || '反方';
      updateTimes(); saveState();
    });

    document.getElementById('swSound').addEventListener('click', () => {
      state.sound = !state.sound; applyInputs(); saveState();
    });
    document.getElementById('swTick').addEventListener('click', () => {
      state.tick = !state.tick; applyInputs(); saveState();
    });
    document.getElementById('swAutoFlow').addEventListener('click', () => {
      state.autoFlow = !state.autoFlow; applyInputs(); saveState();
    });

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.code === 'Space') { e.preventDefault(); toggleRun(); }
      else if (e.key.toLowerCase() === 'r') resetTimer();
      else if (e.key === ',' || e.key === '<' || e.key === 'ArrowLeft') { e.preventDefault(); prevStage(); }
      else if (e.key === '.' || e.key === '>' || e.key === 'ArrowRight') { e.preventDefault(); nextStage(); }
      else if (e.key === '1' && curMode() === 'duel') {
        state.duel.active = 'pro';
        if (!state.running) toggleRun();
        updateDuelActive();
      }
      else if (e.key === '2' && curMode() === 'duel') {
        state.duel.active = 'con';
        if (!state.running) toggleRun();
        updateDuelActive();
      }
      else if (e.key === 'Tab') { e.preventDefault(); nextStage(); }
      else if (e.key.toLowerCase() === 'f') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      else if (e.key.toLowerCase() === 'm') {
        state.sound = !state.sound; applyInputs(); saveState();
      }
    });
  }

  /* ---------------- Init ---------------- */
  loadState();
  timerPresets = loadTimerPresets();
  // ensureCoverStage() 会用 map() 换掉整个 stages 数组，必须跑在 renderStagesList()
  // 之前，否则抽屉里每一行闭包住的都是已经被丢弃的环节对象，
  // 页面刚打开时的第一次改名/改时长/换类型会全部丢失。
  ensureCoverStage();
  if (!state.stages.find(s => s.id === state.currentId)) state.currentId = state.stages[0].id;
  applyTheme();
  applyInputs();
  renderStagesList();
  renderPresetList();
  renderModeTabs();
  if (curMode() === 'cover') {
    state.remaining = 0;
  } else if (curMode() === 'duel') {
    state.duel.pro = curDuration();
    state.duel.con = curDuration();
  } else {
    state.remaining = curDuration();
  }
  renderStage();
  updateFlowDots();
  updateStartButton();
  wire();
})();

</script>
</body>
</html>
